name: Build FakeAppleUpdate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make perl python3 git curl dpkg-dev cmake pkg-config libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cmake -S /tmp/ldid -B /tmp/ldid/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ldid/build --parallel 2
          sudo install -m 0755 /tmp/ldid/build/ldid /usr/local/bin/ldid

      - name: Install Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git clone https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Build rootless package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: make package FINALPACKAGE=1

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: FakeAppleUpdate-rootless
          path: packages/*.deb
          if-no-files-found: error
